name: check vacancies

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub runs this on a best-effort basis
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, probe, or test-notify"
        default: normal
      dates:
        description: "optional test check-in dates, comma separated (probe runs only)"
        default: ""
      chain:
        description: "keep re-dispatching itself about every 5 minutes"
        default: "false"

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_DATES: ${{ inputs.mode == 'probe' && inputs.dates || '' }}
        run: |
          case "${{ inputs.mode }}" in
            probe) python check.py --probe ;;
            test-notify) python check.py --test-notify ;;
            *) python check.py ;;
          esac
      - name: Save probe pages to the probe branch
        if: inputs.mode == 'probe'
        run: |
          git config user.name "ginzan-watch"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B probe
          git add -f probe/
          git commit -qm "probe pages"
          git push -f origin probe
          git checkout main
      - name: Save state
        if: inputs.mode != 'probe' && inputs.mode != 'test-notify'
        run: |
          git config user.name "ginzan-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update vacancy state" && git pull -q --rebase origin main && git push)
      # GitHub's cron is unreliable for new repos, so a chained run waits and
      # then starts the next one itself.
      - name: Queue next check
        if: always() && inputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 210
          gh workflow run check.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=normal -f chain=true
